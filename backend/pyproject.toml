[project]
name = "helix-backend"
version = "2.0.0"
description = "HELIX - 5G Intent-Based Network Slicing System (backend)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "venv", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
# Scoped to source: the test suite leans on Pydantic's **dict-unpacking
# factories and yield-based fixtures, which mypy models poorly and pytest
# already exercises at runtime - not worth chasing here.
files = ["routers", "core", "services", "storage", "models", "main.py"]
